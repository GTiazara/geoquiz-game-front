name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Settings > Secrets and variables > Actions > Variables
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_MATOMO_URL: ${{ vars.VITE_MATOMO_URL }}
      VITE_MATOMO_SITE_ID: ${{ vars.VITE_MATOMO_SITE_ID }}
      VITE_ROUTER_MODE: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure Pages asset path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_PATH_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [[ -s public/CNAME ]]; then
            BASE_PATH="/"
          elif [[ -n "$BASE_PATH_OVERRIDE" ]]; then
            BASE_PATH="$BASE_PATH_OVERRIDE"
          else
            BASE_PATH="${PAGES_BASE_PATH%/}/"
          fi
          echo "VITE_BASE_PATH=${BASE_PATH%/}/" >> "$GITHUB_ENV"
          echo "Frontend asset base: ${BASE_PATH%/}/"
      - name: Validate production API URL
        run: |
          node --input-type=module <<'JS'
          const value = process.env.VITE_API_BASE_URL;
          if (!value) throw new Error('Configure repository variable VITE_API_BASE_URL with your public HTTPS backend URL ending in /api.');
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || !/\/api\/?$/.test(url.pathname) || /localhost|127\.0\.0\.1|votre-domaine|exemple\./i.test(url.hostname)) {
            throw new Error('VITE_API_BASE_URL must be a real public HTTPS API URL ending in /api, without credentials.');
          }
          JS
      - run: npm ci
      - name: Unit tests
        run: npm test
        env:
          VITE_API_BASE_URL: /api
          VITE_ROUTER_MODE: history
      - run: npm run build
      - name: Validate published asset paths
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { JSDOM } from 'jsdom';
          const base = process.env.VITE_BASE_PATH;
          const origin = 'https://build.invalid';
          const document = new JSDOM(readFileSync('dist/index.html', 'utf8')).window.document;
          for (const element of document.querySelectorAll('[src], link[href]')) {
            const value = element.getAttribute('src') ?? element.getAttribute('href');
            const url = new URL(value, origin + base);
            if (url.origin !== origin) continue;
            if (!url.pathname.startsWith(base)) throw new Error(`Asset outside deployment base: ${url.pathname}`);
            const file = resolve('dist', decodeURIComponent(url.pathname.slice(base.length)));
            if (!existsSync(file)) throw new Error(`Missing published asset: ${url.pathname}`);
          }
          console.log(`Published assets verified for base ${base}`);
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
